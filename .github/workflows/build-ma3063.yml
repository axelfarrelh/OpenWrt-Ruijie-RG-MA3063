          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            ccache \
            time

      - name: Check MA3063 source tree
        run: |
          set -eux
          test -x ma3063/scripts/apply-local-patches.sh
          test -f ma3063/src/config-fragment
          test -f ma3063/src/device-makefile-entry.txt
          test -f ma3063/tools/convert-qcn6122-bdf-2.7.py

      - name: Check private router data
        run: |
          set -eux
          test -f ma3063/router-data/bdf/bdwlan.b23
          test -f ma3063/router-data/bdf/qcn6122/bdwlan.b60
          test -f ma3063/router-data/oem-volumes/wifi_fw.bin
          test -f ma3063/router-data/oem-volumes/bt_fw.bin

      - name: Prepare OpenWrt feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply MA3063 patches
        run: |
          set -eux
          chmod +x ma3063/scripts/apply-local-patches.sh
          ma3063/scripts/apply-local-patches.sh "$PWD/openwrt"

      - name: Configure MA3063
        run: |
          set -eux
          cp ma3063/src/config-fragment openwrt/.config
          make -C openwrt defconfig

      - name: Verify target configuration
        run: |
          set -eux
          grep -E \
            'CONFIG_TARGET_qualcommax|CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063' \
            openwrt/.config
          grep -q '^CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063=y$' \
            openwrt/.config

      - name: Build OpenWrt
        run: |
          set -o pipefail
          make -C openwrt -j"$(nproc)" V=s 2>&1 | tee openwrt/build.log

      - name: Verify firmware output
        if: success()
        run: |
          set -eux
          OUT="openwrt/bin/targets/qualcommax/ipq50xx"
          test -d "$OUT"
          find "$OUT" -maxdepth 1 -type f -printf '%f\n' | sort

          test -n "$(find "$OUT" -maxdepth 1 -type f \
            \( -name '*.ubi' -o -name '*sysupgrade*' -o -name '*initramfs*' \) \
            -print -quit)"

      - name: Create checksums
        if: success()
        run: |
          set -eux
          OUT="openwrt/bin/targets/qualcommax/ipq50xx"
          cd "$OUT"
          sha256sum \
            *.ubi \
            *sysupgrade* \
            *initramfs* \
            2>/dev/null | sort > MA3063-SHA256SUMS.txt || true

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-ma3063-25.12.5
          path: |
            openwrt/bin/targets/qualcommax/ipq50xx/*.ubi
            openwrt/bin/targets/qualcommax/ipq50xx/*sysupgrade*
            openwrt/bin/targets/qualcommax/ipq50xx/*initramfs*
            openwrt/bin/targets/qualcommax/ipq50xx/MA3063-SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-ma3063-build-log
          path: |
            openwrt/build.log
            openwrt/.config
          if-no-files-found: warn
          compression-level: 6
